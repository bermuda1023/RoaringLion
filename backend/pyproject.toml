[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roaring-lion-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=17.0",
  "highspy>=1.8",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pypdf>=5.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
