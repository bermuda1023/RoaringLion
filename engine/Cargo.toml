[package]
name = "roaring_lion_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "roaring_lion_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench_kernel"
path = "src/bin/bench_kernel.rs"

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", optional = true }
numpy = { version = "0.22", optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
